<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <!-- seo:start -->
    <!--
      Everything between the seo markers is regenerated for each route at build
      time by scripts/prerender.js, so /projects/starwave ships its own title,
      description, and poster card rather than inheriting the homepage's. What
      is written below is the homepage copy, and what the dev server shows on
      every route. Edit shared wording in src/site/seo.js.
    -->
    <title>Viren Chauhan | Game Technology &amp; Software Developer</title>
    <meta
      name="description"
      content="Game Technology & Software Developer building game systems, developer tools, AI-powered products, and interactive experiences with Unreal Engine, Unity, C#, C++, and modern software technologies."
    />
    <link rel="canonical" href="https://virenchauhan.com/" />

    <!-- Social preview cards (LinkedIn, Slack, iMessage, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://virenchauhan.com/" />
    <meta property="og:site_name" content="Viren Chauhan" />
    <meta property="og:title" content="Viren Chauhan | Game Technology & Software Developer" />
    <meta
      property="og:description"
      content="Game Technology & Software Developer building game systems, developer tools, AI-powered products, and interactive experiences with Unreal Engine, Unity, C#, C++, and modern software technologies."
    />
    <meta property="og:image" content="https://virenchauhan.com/headshot.jpeg" />
    <meta property="og:image:alt" content="Viren Chauhan headshot" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:title" content="Viren Chauhan | Game Technology & Software Developer" />
    <meta
      name="twitter:description"
      content="Game Technology & Software Developer building game systems, developer tools, AI-powered products, and interactive experiences with Unreal Engine, Unity, C#, C++, and modern software technologies."
    />
    <meta name="twitter:image" content="https://virenchauhan.com/headshot.jpeg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Viren Chauhan",
        "url": "https://virenchauhan.com/",
        "image": "https://virenchauhan.com/headshot.jpeg",
        "jobTitle": "Game Technology & Software Developer",
        "email": "mailto:chauhan.viren08@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Atlanta", "addressRegion": "GA", "addressCountry": "US" },
        "affiliation": { "@type": "CollegeOrUniversity", "name": "Savannah College of Art and Design" },
        "knowsAbout": [
          "C#", "C++", "Python", "Unreal Engine", "Unity", "Gameplay Systems",
          "React", "Next.js", "Firebase", "Applied AI"
        ],
        "sameAs": [
          "https://github.com/VirenChauhan19",
          "https://www.linkedin.com/in/viren-chauhan-7b1067333/"
        ]
      }
    </script>
    <!-- seo:end -->

    <!-- Old links used hash routes (/#/projects/x). Rewrite them to real paths
         before the router mounts so bookmarks and shared links keep working. -->
    <script>
      ;(function () {
        var h = window.location.hash
        if (h && h.indexOf('#/') === 0) {
          history.replaceState(null, '', h.slice(1) + window.location.search)
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/jpeg" href="%BASE_URL%headshot.jpeg" />
    <link rel="apple-touch-icon" href="%BASE_URL%headshot.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
